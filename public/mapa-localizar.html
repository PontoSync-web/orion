<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION AI-DEPOM</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Estilos mantidos */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #00ff88; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #1a1a2e; padding: 15px 20px; border-bottom: 1px solid #00ff88; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; z-index: 1000; }
        #header h1 { font-size: 1.5em; color: #00ff88; }
        #header .status { font-size: 0.9em; color: #88ffbb; }
        #controls { background: #1a1a2e; padding: 15px 20px; border-bottom: 1px solid #00ff88; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; z-index: 1000; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 0.8em; color: #88ffbb; margin-bottom: 2px; }
        .control-group input, .control-group select { padding: 8px 12px; background: #0a0a1a; color: #00ff88; border: 1px solid #00ff88; border-radius: 4px; font-size: 0.9em; min-width: 140px; }
        .control-group input::placeholder { color: #446655; }
        .btn { padding: 8px 20px; background: #00ff88; color: #0a0a1a; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.9em; }
        .btn:hover { background: #88ffbb; }
        .btn-secondary { background: #1a1a2e; color: #00ff88; border: 1px solid #00ff88; }
        .btn-secondary:hover { background: #2a2a4e; }
        .btn-success { background: #00cc66; color: #0a0a1a; }
        .btn-success:hover { background: #44dd88; }
        #map { flex: 1; width: 100%; z-index: 1; }
        #resultado { position: fixed; bottom: 20px; right: 20px; background: #1a1a2e; border: 1px solid #00ff88; border-radius: 8px; padding: 15px; max-width: 400px; max-height: 300px; overflow-y: auto; z-index: 1000; font-size: 0.8em; color: #88ffbb; display: none; }
        #resultado.show { display: block; }
        #resultado .close { float: right; cursor: pointer; color: #ff6666; font-weight: bold; }
        .leaflet-popup-content { color: #0a0a1a; }
        .btn-geo { background: #ffaa00; color: #0a0a1a; }
        .btn-geo:hover { background: #ffcc44; }
        .status-location { font-size: 0.8em; margin-left: 10px; color: #88ffbb; }
        @media (max-width: 768px) {
            #header { flex-direction: column; align-items: flex-start; }
            #controls { flex-direction: column; align-items: stretch; }
            .control-group { width: 100%; }
            .control-group input, .control-group select { width: 100%; min-width: unset; }
            #resultado { max-width: 90vw; right: 5vw; bottom: 10px; }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>📍 ORION AI-DEPOM</h1>
        <div>
            <span class="status" id="status">🟢 Conectado</span>
            <span class="status-location" id="statusLocation">📍 Aguardando busca...</span>
        </div>
    </div>

    <div id="controls">
        <!-- ====== SEÇÃO DE BUSCA ====== -->
        <div class="control-group">
            <label for="numero">Número para buscar *</label>
            <input type="text" id="numero" placeholder="Ex: 71985549724">
        </div>
        <button class="btn btn-secondary" id="btnLocalizar">🔍 Localizar</button>

        <span class="separator">|</span>

        <!-- ====== SEÇÃO DE CADASTRO RÁPIDO ====== -->
        <div class="control-group">
            <label for="novoNumero">Novo Número</label>
            <input type="text" id="novoNumero" placeholder="71985549724">
        </div>
        <div class="control-group">
            <label for="novaOperadora">Operadora</label>
            <select id="novaOperadora">
                <option value="TIM">TIM</option>
                <option value="VIVO">VIVO</option>
                <option value="CLARO">CLARO</option>
                <option value="OI">OI</option>
                <option value="OUTRA">Outra</option>
            </select>
        </div>
        <div class="control-group">
            <label for="novoNome">Nome (opcional)</label>
            <input type="text" id="novoNome" placeholder="Identificação">
        </div>
        <button class="btn btn-success" id="btnCadastrar">💾 Cadastrar</button>
    </div>

    <div id="map"></div>

    <div id="resultado">
        <span class="close" id="closeResultado">×</span>
        <pre id="resultadoConteudo">Aguardando...</pre>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DA API
        // ============================================================
        const API_URL = window.location.origin;

        // ============================================================
        // FUNÇÕES DE API
        // ============================================================
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_URL}${endpoint}`;
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Erro ${response.status}: ${errorText}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`❌ Erro na requisição para ${url}:`, error);
                throw error;
            }
        }

        // ============================================================
        // INICIALIZAÇÃO DO MAPA
        // ============================================================
        const map = L.map('map').setView([-15.8, -47.9], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        let markerLayer = L.layerGroup().addTo(map);
        let markers = {};
        let minhaLocalizacaoMarker = null;
        let usuarioLat = null;
        let usuarioLon = null;
        let localizacaoObtida = false;

        // ============================================================
        // FUNÇÕES DE MAPA
        // ============================================================
        function adicionarMarcadores(estacoes) {
            markerLayer.clearLayers();
            markers = {};

            if (!estacoes || estacoes.length === 0) {
                mostrarResultado('Nenhuma estação encontrada.');
                return;
            }

            estacoes.forEach((estacao) => {
                const lat = estacao.latitude;
                const lon = estacao.longitude;
                if (!lat || !lon) return;

                const marker = L.marker([lat, lon], { title: estacao.id_estacao });
                const popupContent = `
                    <strong>ID:</strong> ${estacao.id_estacao}<br>
                    <strong>Operadora:</strong> ${estacao.operadora || 'N/A'}<br>
                    <strong>UF:</strong> ${estacao.uf || 'N/A'}<br>
                    <strong>Município:</strong> ${estacao.municipio || 'N/A'}<br>
                    <strong>Tecnologias:</strong> ${estacao.tecnologias || 'N/A'}<br>
                    <strong>Frequências:</strong> ${estacao.frequencias || 'N/A'}<br>
                    <strong>Distância:</strong> ${estacao.distancia ? estacao.distancia.toFixed(2) + ' km' : 'N/A'}
                `;
                marker.bindPopup(popupContent);
                markerLayer.addLayer(marker);
                markers[estacao.id_estacao] = marker;
            });

            if (estacoes.length > 0) {
                const group = L.featureGroup(Object.values(markers));
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            }
        }

        function adicionarMinhaLocalizacao(lat, lon) {
            if (minhaLocalizacaoMarker) map.removeLayer(minhaLocalizacaoMarker);
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background-color:#ff4444; width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(255,68,68,0.8);"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            minhaLocalizacaoMarker = L.marker([lat, lon], { icon }).addTo(map);
            minhaLocalizacaoMarker.bindPopup('📍 Sua localização atual');
            usuarioLat = lat;
            usuarioLon = lon;
            localizacaoObtida = true;
            map.setView([lat, lon], 12);
            document.getElementById('statusLocation').textContent = `📍 Localização: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            mostrarResultado(`📍 Localização atual: ${lat.toFixed(4)}, ${lon.toFixed(4)}`);
        }

        // ============================================================
        // FUNÇÃO PARA OBTER DADOS DE SINAL E ENVIAR PARA O ORION
        // ============================================================
        async function coletarDadosSinal(numero, estacao, latitude, longitude) {
            try {
                // Tenta obter dados de sinal do navegador (se disponível)
                let rsrp = null, sinr = null, ta = null;

                // Simulação: valores estimados (em produção, seriam capturados de uma API nativa)
                if (navigator.connection) {
                    // Exemplo de estimativa: quanto pior a conexão, pior o sinal
                    const tipoConexao = navigator.connection.effectiveType;
                    if (tipoConexao === '4g') {
                        rsrp = -75;
                        sinr = 20;
                        ta = 0;
                    } else if (tipoConexao === '3g') {
                        rsrp = -85;
                        sinr = 15;
                        ta = 1;
                    } else {
                        rsrp = -95;
                        sinr = 10;
                        ta = 2;
                    }
                }

                // Se não conseguiu obter dados reais, usa valores estimados com base na distância
                if (rsrp === null) {
                    // Estima a distância da ERB (quanto mais longe, pior o sinal)
                    const distKm = estacao.distancia || 0; // Usar a distância retornada pela API
                    rsrp = -70 - distKm * 10;
                    sinr = 25 - distKm * 2;
                    ta = Math.round(distKm * 5);
                }

                const data = {
                    numero: numero,
                    estacao_id: estacao.id_estacao || estacao,
                    latitude: latitude,
                    longitude: longitude,
                    rsrp: rsrp,
                    sinr: sinr,
                    ta: ta
                };

                const response = await fetch(`${API_URL}/api/coletar-sinal-auto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                console.log('📡 Dados de sinal coletados:', result);
                return result;
            } catch (error) {
                console.error('❌ Erro ao coletar dados de sinal:', error);
                return null;
            }
        }

        // ============================================================
        // FUNÇÃO DE LOCALIZAÇÃO REAL
        // ============================================================
        function obterLocalizacao() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    document.getElementById('statusLocation').textContent = '❌ Geolocalização não suportada';
                    mostrarResultado('❌ Seu navegador não suporta geolocalização.');
                    resolve(null);
                    return;
                }

                document.getElementById('statusLocation').textContent = '⏳ Solicitando permissão de localização...';
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        document.getElementById('statusLocation').textContent = `✅ Localização obtida!`;
                        resolve({ lat: latitude, lon: longitude });
                    },
                    (error) => {
                        let msg = '';
                        switch (error.code) {
                            case error.PERMISSION_DENIED: msg = 'Permissão negada pelo usuário.'; break;
                            case error.POSITION_UNAVAILABLE: msg = 'Localização indisponível.'; break;
                            case error.TIMEOUT: msg = 'Tempo limite excedido.'; break;
                            default: msg = error.message;
                        }
                        document.getElementById('statusLocation').textContent = `❌ Erro: ${msg}`;
                        mostrarResultado(`❌ Erro de localização: ${msg}`);
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        // ============================================================
        // FUNÇÕES DE INTERFACE
        // ============================================================
        function mostrarResultado(mensagem) {
            const el = document
