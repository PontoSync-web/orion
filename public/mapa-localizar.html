<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - Localizador Inteligente</title>
    <!-- Leaflet CSS (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #00d4ff; margin-bottom: 20px; text-shadow: 0 0 10px #00d4ff77; }
        .container { width: 100%; max-width: 900px; background: #132b44; padding: 20px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #1e3a5f; color: #fff; font-size: 16px; outline: 1px solid #2a4a7a; }
        .search-box input:focus { outline: 2px solid #00d4ff; }
        .search-box button { padding: 12px 24px; background: #00d4ff; border: none; border-radius: 8px; font-weight: bold; color: #0b1a2e; cursor: pointer; transition: 0.3s; }
        .search-box button:hover { background: #00b8e6; transform: scale(1.02); }
        #map { height: 450px; border-radius: 12px; margin: 15px 0; border: 2px solid #2a4a7a; }
        .info-panel { background: #0b1a2e; padding: 15px; border-radius: 10px; margin: 10px 0; display: none; border-left: 4px solid #00d4ff; }
        .info-panel.visible { display: block; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .info-item { background: #132b44; padding: 8px 12px; border-radius: 6px; }
        .info-item label { font-size: 11px; color: #88bbdd; display: block; }
        .info-item span { font-size: 16px; font-weight: bold; color: #fff; }
        .precisao-alta { color: #4caf50; }
        .precisao-media { color: #ffc107; }
        .precisao-baixa { color: #f44336; }
        .feedback-area { display: none; margin-top: 15px; padding: 15px; background: #1a3350; border-radius: 10px; border: 1px dashed #00d4ff; }
        .feedback-area.visible { display: block; }
        .feedback-area button { background: #ffc107; color: #0b1a2e; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .feedback-area button:hover { background: #ffb300; }
        .erro { color: #ff6b6b; padding: 10px; background: #2a1a1a; border-radius: 6px; margin: 10px 0; display: none; }
        .loading { color: #88bbdd; text-align: center; padding: 20px; display: none; }
        .footer { margin-top: 20px; color: #557799; font-size: 12px; }
        #coords-corrigidas { font-size: 13px; color: #88bbdd; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📍 Orion - Localizador</h1>
    
    <div class="search-box">
        <input type="text" id="numeroInput" placeholder="Digite o número (ex: 71988979724)" value="71988979724">
        <button onclick="buscarLocalizacao()">🔍 Localizar</button>
    </div>

    <div id="loading" class="loading">⏳ Buscando localização...</div>
    <div id="erro" class="erro"></div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Painel de Informações -->
    <div id="infoPanel" class="info-panel">
        <div class="info-grid">
            <div class="info-item"><label>📌 Latitude</label><span id="infoLat">-</span></div>
            <div class="info-item"><label>📌 Longitude</label><span id="infoLon">-</span></div>
            <div class="info-item"><label>📡 Precisão</label><span id="infoPrecisao">-</span></div>
            <div class="info-item"><label>🎯 Raio Incerteza</label><span id="infoRaio">-</span></div>
            <div class="info-item"><label>📊 Amostras</label><span id="infoAmostras">-</span></div>
            <div class="info-item"><label>🕒 Última atualização</label><span id="infoData">-</span></div>
        </div>
        <div id="coords-corrigidas"></div>
    </div>

    <!-- Área de Feedback -->
    <div id="feedbackArea" class="feedback-area">
        <p><strong>📍 A localização está errada?</strong></p>
        <p style="font-size:13px; color:#88bbdd;">Arraste o marcador <strong>vermelho</strong> no mapa para o local correto e clique em "Enviar Correção".</p>
        <button onclick="enviarFeedback()">✅ Enviar Correção</button>
        <span id="feedbackStatus" style="margin-left:15px; color:#4caf50;"></span>
    </div>

    <div class="footer">Orion v2.0 • Aprendizado Contínuo • Feedbacks melhoram a precisão</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // ============================================================
    // CONFIGURAÇÕES
    // ============================================================
    const API_URL = window.location.origin; // Ex: https://orion-29ko.onrender.com
    let map, marker, circle, posicaoAtual = null;
    let markerCorrigido = null; // Marcador vermelho para correção

    // Inicializa o mapa
    function initMap(lat = -12.9342, lon = -38.3751) {
        if (map) {
            map.setView([lat, lon], 14);
            return;
        }
        map = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Clique no mapa para mover o marcador de correção
        map.on('click', function(e) {
            if (!posicaoAtual) return;
            // Atualiza o marcador vermelho (correção)
            if (!markerCorrigido) {
                markerCorrigido = L.marker([e.latlng.lat, e.latlng.lng], {
                    draggable: true,
                    icon: L.icon({
                        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    })
                }).addTo(map);
            } else {
                markerCorrigido.setLatLng([e.latlng.lat, e.latlng.lng]);
            }
            // Mostra a área de feedback
            document.getElementById('feedbackArea').classList.add('visible');
            document.getElementById('feedbackStatus').textContent = '📍 Nova posição definida. Clique em "Enviar Correção".';
        });
    }

    // ============================================================
    // BUSCAR LOCALIZAÇÃO
    // ============================================================
    async function buscarLocalizacao() {
        const numero = document.getElementById('numeroInput').value.trim();
        if (!numero) {
            mostrarErro('Digite um número válido.');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('erro').style.display = 'none';
        document.getElementById('infoPanel').classList.remove('visible');
        document.getElementById('feedbackArea').classList.remove('visible');

        try {
            const response = await fetch(`${API_URL}/api/localizar?numero=${encodeURIComponent(numero)}`);
            const data = await response.json();

            if (!response.ok) {
                mostrarErro(data.erro || 'Número não encontrado.');
                return;
            }

            // Sucesso
            posicaoAtual = {
                lat: data.latitude,
                lon: data.longitude,
                raio: data.raio_incerteza_metros,
                precisao: data.precisao,
                amostras: data.total_amostras,
                data: data.ultima_atualizacao
            };

            // Atualiza o mapa
            initMap(data.latitude, data.longitude);
            if (marker) map.removeLayer(marker);
            marker = L.marker([data.latitude, data.longitude], {
                icon: L.icon({
                    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41]
                })
            }).addTo(map);

            // Desenha o círculo de incerteza
            if (circle) map.removeLayer(circle);
            circle = L.circle([data.latitude, data.longitude], {
                radius: data.raio_incerteza_metros,
                color: data.precisao === 'Alta' ? '#4caf50' : data.precisao === 'Média' ? '#ffc107' : '#f44336',
                fillColor: data.precisao === 'Alta' ? '#4caf50' : data.precisao === 'Média' ? '#ffc107' : '#f44336',
                fillOpacity: 0.15,
                weight: 2
            }).addTo(map);

            map.setView([data.latitude, data.longitude], 15);

            // Atualiza o painel
            document.getElementById('infoLat').textContent = data.latitude.toFixed(6);
            document.getElementById('infoLon').textContent = data.longitude.toFixed(6);
            document.getElementById('infoPrecisao').textContent = data.precisao;
            document.getElementById('infoPrecisao').className = `precisao-${data.precisao.toLowerCase()}`;
            document.getElementById('infoRaio').textContent = `${data.raio_incerteza_metros} m`;
            document.getElementById('infoAmostras').textContent = data.total_amostras;
            document.getElementById('infoData').textContent = data.ultima_atualizacao ? new Date(data.ultima_atualizacao).toLocaleString() : 'N/A';
            document.getElementById('infoPanel').classList.add('visible');

            // Mostra o método usado
            document.getElementById('coords-corrigidas').textContent = `🧠 Método: ${data.metodo || 'Orion v2'}`;

            // Se o usuário quiser corrigir, mostra o botão de feedback
            document.getElementById('feedbackArea').classList.add('visible');
            document.getElementById('feedbackStatus').textContent = '🟡 Clique no mapa para corrigir a localização se estiver errada.';

            // Remove marcador de correção anterior
            if (markerCorrigido) {
                map.removeLayer(markerCorrigido);
                markerCorrigido = null;
            }

        } catch (error) {
            mostrarErro('Erro de conexão com o servidor.');
            console.error(error);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // ============================================================
    // ENVIAR FEEDBACK
    // ============================================================
    async function enviarFeedback() {
        const numero = document.getElementById('numeroInput').value.trim();
        if (!posicaoAtual) {
            alert('Nenhuma localização carregada para corrigir.');
            return;
        }
        if (!markerCorrigido) {
            alert('Clique no mapa para definir a localização correta primeiro.');
            return;
        }

        const latReal = markerCorrigido.getLatLng().lat;
        const lonReal = markerCorrigido.getLatLng().lng;
        const latMostrada = posicaoAtual.lat;
        const lonMostrada = posicaoAtual.lon;

        // Confirmação
        if (!confirm(`Deseja corrigir a localização de ${numero}?\n\nCorreção: ${latReal.toFixed(6)}, ${lonReal.toFixed(6)}\nAnterior: ${latMostrada.toFixed(6)}, ${lonMostrada.toFixed(6)}`)) {
            return;
        }

        document.getElementById('feedbackStatus').textContent = '⏳ Enviando correção...';

        try {
            const response = await fetch(`${API_URL}/api/feedback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    numero: numero,
                    lat_real: latReal,
                    lon_real: lonReal,
                    lat_mostrada: latMostrada,
                    lon_mostrada: lonMostrada
                })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById('feedbackStatus').textContent = '✅ Correção enviada! Obrigado! O sistema vai aprender com isso.';
                document.getElementById('feedbackStatus').style.color = '#4caf50';
                
                // Remove o marcador de correção e recarrega a localização para mostrar o ajuste
                if (markerCorrigido) {
                    map.removeLayer(markerCorrigido);
                    markerCorrigido = null;
                }
                // Busca novamente para mostrar a posição já ajustada
                setTimeout(() => buscarLocalizacao(), 2000);
            } else {
                document.getElementById('feedbackStatus').textContent = '❌ Erro ao enviar: ' + (data.erro || 'Tente novamente');
                document.getElementById('feedbackStatus').style.color = '#f44336';
            }
        } catch (error) {
            document.getElementById('feedbackStatus').textContent = '❌ Erro de conexão.';
            document.getElementById('feedbackStatus').style.color = '#f44336';
            console.error(error);
        }
    }

    // ============================================================
    // FUNÇÕES AUXILIARES
    // ============================================================
    function mostrarErro(msg) {
        const el = document.getElementById('erro');
        el.textContent = '❌ ' + msg;
        el.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
    }

    // Carrega o mapa inicial (Salvador - Piatã)
    document.addEventListener('DOMContentLoaded', () => {
        initMap(-12.9342, -38.3751);
    });

    // Permite enviar com Enter
    document.getElementById('numeroInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') buscarLocalizacao();
    });
</script>
</body>
</html>
