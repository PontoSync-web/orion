<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - Localizador Inteligente</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 950px; background: #132b44; padding: 20px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #1e3a5f; color: #fff; font-size: 16px; outline: 1px solid #2a4a7a; }
        .search-box input:focus { outline: 2px solid #00d4ff; }
        .search-box button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-buscar { background: #00d4ff; color: #0b1a2e; }
        .btn-buscar:hover { background: #00b8e6; }
        #map { height: 450px; border-radius: 12px; margin: 15px 0; border: 2px solid #2a4a7a; }
        .info-panel { background: #0b1a2e; padding: 15px; border-radius: 10px; margin: 10px 0; display: none; border-left: 4px solid #00d4ff; }
        .info-panel.visible { display: block; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
        .info-item { background: #132b44; padding: 6px 10px; border-radius: 6px; }
        .info-item label { font-size: 10px; color: #88bbdd; display: block; }
        .info-item span { font-size: 14px; font-weight: bold; color: #fff; }
        .precisao-alta { color: #4caf50; }
        .feedback-area { display: none; margin-top: 15px; padding: 15px; background: #1a3350; border-radius: 10px; border: 1px dashed #00d4ff; }
        .feedback-area.visible { display: block; }
        .feedback-area button { background: #ffc107; color: #0b1a2e; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .feedback-area button:hover { background: #ffb300; }
        .erro { color: #ff6b6b; padding: 10px; background: #2a1a1a; border-radius: 6px; margin: 10px 0; display: none; }
        .loading { color: #88bbdd; text-align: center; padding: 20px; display: none; }
        .feedback-success { color: #4caf50; }
        .feedback-error { color: #f44336; }
        .feedback-info { color: #ffc107; }
        #feedbackStatus { margin-left: 15px; }
        .debug { background: #1a1a2e; color: #88ddff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; margin-top: 10px; display: none; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow-y: auto; }
        .debug.visible { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>📍 Orion - Localizador</h1>
    
    <div class="search-box">
        <input type="text" id="numeroInput" placeholder="Digite o número (ex: 71988979724)" value="71988979724">
        <button class="btn-buscar" onclick="buscarLocalizacao()">🔍 Localizar</button>
    </div>

    <div id="loading" class="loading">⏳ Buscando localização...</div>
    <div id="erro" class="erro"></div>

    <div id="map"></div>

    <div id="infoPanel" class="info-panel">
        <div class="info-grid">
            <div class="info-item"><label>📌 Latitude</label><span id="infoLat">-</span></div>
            <div class="info-item"><label>📌 Longitude</label><span id="infoLon">-</span></div>
            <div class="info-item"><label>📡 Precisão</label><span id="infoPrecisao">-</span></div>
            <div class="info-item"><label>🎯 Raio Incerteza</label><span id="infoRaio">-</span></div>
            <div class="info-item"><label>📊 Amostras</label><span id="infoAmostras">-</span></div>
            <div class="info-item"><label>🕒 Última atualização</label><span id="infoData">-</span></div>
        </div>
        <div id="metodo">🧠 Método: Aguardando consulta...</div>
        <div id="viesInfo" style="font-size:13px; color:#88bbdd; margin-top:5px;"></div>
    </div>

    <div id="feedbackArea" class="feedback-area">
        <p><strong>📍 A localização está errada?</strong></p>
        <p style="font-size:13px; color:#88bbdd;">Clique no mapa para definir a localização correta e clique em "Enviar Correção".</p>
        <button onclick="enviarFeedback()">✅ Enviar Correção</button>
        <span id="feedbackStatus" class="feedback-info">🟡 Aguardando ação...</span>
    </div>

    <div id="debug" class="debug"></div>

    <div class="footer" style="margin-top:20px; color:#557799; font-size:12px;">
        Orion v3.1 • Aprendizado contínuo • Feedbacks melhoram a precisão
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const API_URL = window.location.origin;
    let map, marker, circle, posicaoAtual = null;
    let markerCorrigido = null;

    function parseNumber(value) {
        if (typeof value === 'number' && !isNaN(value)) return value;
        if (typeof value === 'string') {
            const cleaned = value.replace(',', '.').trim();
            const num = parseFloat(cleaned);
            return isNaN(num) ? null : num;
        }
        return null;
    }

    function logDebug(msg) {
        const el = document.getElementById('debug');
        el.textContent += msg + '\n';
        el.classList.add('visible');
        console.log(msg);
    }

    function initMap(lat = -12.9342, lon = -38.3751) {
        if (map) {
            map.setView([lat, lon], 14);
            return;
        }
        map = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        map.on('click', function(e) {
            if (!posicaoAtual) {
                alert('Primeiro faça uma busca.');
                return;
            }
            if (!markerCorrigido) {
                markerCorrigido = L.marker([e.latlng.lat, e.latlng.lng], { draggable: true }).addTo(map);
                markerCorrigido._icon.style.filter = 'hue-rotate(120deg) saturate(3)';
            } else {
                markerCorrigido.setLatLng([e.latlng.lat, e.latlng.lng]);
            }
            document.getElementById('feedbackArea').classList.add('visible');
            document.getElementById('feedbackStatus').textContent = '📍 Nova posição definida. Clique em "Enviar Correção".';
            document.getElementById('feedbackStatus').className = 'feedback-info';
        });
    }

    async function buscarLocalizacao() {
        const numero = document.getElementById('numeroInput').value.trim();
        if (!numero) {
            alert('Digite um número válido.');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('erro').style.display = 'none';
        document.getElementById('infoPanel').classList.remove('visible');
        document.getElementById('feedbackArea').classList.remove('visible');
        document.getElementById('debug').classList.remove('visible');
        document.getElementById('debug').textContent = '';
        logDebug('🔍 Buscando: ' + numero);

        try {
            const response = await fetch(`${API_URL}/api/localizar-fallback?numero=${encodeURIComponent(numero)}`);
            const data = await response.json();
            logDebug('📦 Resposta do servidor: ' + JSON.stringify(data, null, 2));

            if (!response.ok) {
                document.getElementById('erro').textContent = '❌ ' + (data.erro || 'Número não encontrado.');
                document.getElementById('erro').style.display = 'block';
                return;
            }

            const lat = parseNumber(data.latitude);
            const lon = parseNumber(data.longitude);
            if (lat === null || lon === null) {
                alert('Coordenadas inválidas.');
                return;
            }

            posicaoAtual = {
                lat: lat,
                lon: lon,
                raio: data.raio_incerteza_metros || 300,
                precisao: data.precisao || 'Média',
                amostras: data.total_amostras || 0,
                data: data.ultima_atualizacao
            };

            initMap(lat, lon);

            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map);

            if (circle) map.removeLayer(circle);
            const cor = posicaoAtual.precisao === 'Alta' ? '#4caf50' : '#ffc107';
            circle = L.circle([lat, lon], {
                radius: posicaoAtual.raio,
                color: cor,
                fillColor: cor,
                fillOpacity: 0.15,
                weight: 2
            }).addTo(map);

            map.setView([lat, lon], 15);

            document.getElementById('infoLat').textContent = lat.toFixed(6);
            document.getElementById('infoLon').textContent = lon.toFixed(6);
            document.getElementById('infoPrecisao').textContent = posicaoAtual.precisao;
            document.getElementById('infoPrecisao').className = `precisao-${posicaoAtual.precisao.toLowerCase()}`;
            document.getElementById('infoRaio').textContent = `${posicaoAtual.raio} m`;
            document.getElementById('infoAmostras').textContent = posicaoAtual.amostras || 'N/A';
            document.getElementById('infoData').textContent = data.ultima_atualizacao ? new Date(data.ultima_atualizacao).toLocaleString() : 'N/A';
            document.getElementById('metodo').textContent = `🧠 Método: ${data.metodo || 'Orion v3.1'}`;
            
            if (data.vies_aplicado) {
                document.getElementById('viesInfo').textContent = 
                    `📊 Viés aplicado: lat=${data.vies_aplicado.lat || 0}, lon=${data.vies_aplicado.lon || 0}`;
            }

            document.getElementById('infoPanel').classList.add('visible');
            document.getElementById('feedbackArea').classList.add('visible');
            document.getElementById('feedbackStatus').textContent = '🟡 Clique no mapa para corrigir.';
            document.getElementById('feedbackStatus').className = 'feedback-info';

            if (markerCorrigido) {
                map.removeLayer(markerCorrigido);
                markerCorrigido = null;
            }

        } catch (error) {
            logDebug('❌ Erro: ' + error.message);
            document.getElementById('erro').textContent = '❌ Erro de conexão.';
            document.getElementById('erro').style.display = 'block';
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    async function enviarFeedback() {
        const numero = document.getElementById('numeroInput').value.trim();
        if (!posicaoAtual) {
            alert('Nenhuma localização carregada.');
            return;
        }
        if (!markerCorrigido) {
            alert('Clique no mapa para definir a localização correta.');
            return;
        }

        // CONVERTE VÍRGULA PARA PONTO
        const latReal = parseNumber(markerCorrigido.getLatLng().lat);
        const lonReal = parseNumber(markerCorrigido.getLatLng().lng);
        const latMostrada = parseNumber(posicaoAtual.lat);
        const lonMostrada = parseNumber(posicaoAtual.lon);

        logDebug('📤 Enviando feedback:');
        logDebug(`  lat_real: ${latReal} (${typeof latReal})`);
        logDebug(`  lon_real: ${lonReal} (${typeof lonReal})`);
        logDebug(`  lat_mostrada: ${latMostrada} (${typeof latMostrada})`);
        logDebug(`  lon_mostrada: ${lonMostrada} (${typeof lonMostrada})`);

        if (latReal === null || lonReal === null || latMostrada === null || lonMostrada === null) {
            alert('Erro: coordenadas inválidas.');
            return;
        }

        const body = {
            numero: numero,
            lat_real: latReal,
            lon_real: lonReal,
            lat_mostrada: latMostrada,
            lon_mostrada: lonMostrada,
            metodo: 'frontend',
            rsrp: null,
            sinr: null,
            ta: null
        };

        logDebug('📦 Body enviado: ' + JSON.stringify(body));

        const statusEl = document.getElementById('feedbackStatus');
        statusEl.textContent = '⏳ Enviando...';
        statusEl.className = 'feedback-info';

        try {
            const response = await fetch(`${API_URL}/api/feedback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();
            logDebug('📦 Resposta do servidor: ' + JSON.stringify(data));

            if (response.ok) {
                statusEl.textContent = '✅ Correção enviada! O sistema vai aprender.';
                statusEl.className = 'feedback-success';
                if (markerCorrigido) {
                    map.removeLayer(markerCorrigido);
                    markerCorrigido = null;
                }
                setTimeout(() => buscarLocalizacao(), 2000);
            } else {
                statusEl.textContent = '❌ Erro: ' + (data.erro || 'Tente novamente');
                statusEl.className = 'feedback-error';
                alert('Erro ao enviar feedback:\n' + JSON.stringify(data, null, 2));
            }
        } catch (error) {
            logDebug('❌ Erro de rede: ' + error.message);
            statusEl.textContent = '❌ Erro de conexão.';
            statusEl.className = 'feedback-error';
            alert('Erro de conexão: ' + error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initMap(-12.9342, -38.3751);
    });

    document.getElementById('numeroInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') buscarLocalizacao();
    });
</script>
</body>
</html>
