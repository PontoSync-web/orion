<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION AI-DEPOM</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #00ff88;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background: #1a1a2e;
            padding: 15px 20px;
            border-bottom: 1px solid #00ff88;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
        }
        #header h1 {
            font-size: 1.5em;
            color: #00ff88;
        }
        #header .status {
            font-size: 0.9em;
            color: #88ffbb;
        }
        #controls {
            background: #1a1a2e;
            padding: 15px 20px;
            border-bottom: 1px solid #00ff88;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            z-index: 1000;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 0.8em;
            color: #88ffbb;
        }
        .control-group input,
        .control-group select {
            padding: 8px 12px;
            background: #0a0a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 4px;
            font-size: 0.9em;
            min-width: 150px;
        }
        .control-group input::placeholder {
            color: #446655;
        }
        .btn {
            padding: 8px 20px;
            background: #00ff88;
            color: #0a0a1a;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9em;
        }
        .btn:hover {
            background: #88ffbb;
        }
        .btn-secondary {
            background: #1a1a2e;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .btn-secondary:hover {
            background: #2a2a4e;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        #resultado {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            font-size: 0.8em;
            color: #88ffbb;
            display: none;
        }
        #resultado.show {
            display: block;
        }
        #resultado .close {
            float: right;
            cursor: pointer;
            color: #ff6666;
            font-weight: bold;
        }
        .leaflet-popup-content {
            color: #0a0a1a;
        }
        /* Responsividade */
        @media (max-width: 768px) {
            #header {
                flex-direction: column;
                align-items: flex-start;
            }
            #controls {
                flex-direction: column;
                align-items: stretch;
            }
            .control-group {
                width: 100%;
            }
            .control-group input,
            .control-group select {
                width: 100%;
                min-width: unset;
            }
            #resultado {
                max-width: 90vw;
                right: 5vw;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>📍 ORION AI-DEPOM</h1>
        <span class="status" id="status">🟢 Conectado</span>
    </div>

    <div id="controls">
        <div class="control-group">
            <label for="numero">Número de celular *</label>
            <input type="text" id="numero" placeholder="Ex: 71985549724">
        </div>
        <div class="control-group">
            <label for="operadora">Operadora</label>
            <select id="operadora">
                <option value="TIM">TIM</option>
                <option value="VIVO">VIVO</option>
                <option value="CLARO">CLARO</option>
                <option value="OI">OI</option>
                <option value="OUTRA">Outra</option>
            </select>
        </div>
        <div class="control-group">
            <label for="nome">Nome (opcional)</label>
            <input type="text" id="nome" placeholder="Investigador">
        </div>
        <button class="btn" id="btnCadastrar">💾 Cadastrar</button>
        <button class="btn btn-secondary" id="btnLocalizar">🔍 Localizar por número</button>
    </div>

    <div id="map"></div>

    <div id="resultado">
        <span class="close" id="closeResultado">×</span>
        <pre id="resultadoConteudo">Aguardando...</pre>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DA API
        // ============================================================
        const API_URL = window.location.origin;

        // ============================================================
        // FUNÇÕES DE API
        // ============================================================
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_URL}${endpoint}`;
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    }
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Erro ${response.status}: ${errorText}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`❌ Erro na requisição para ${url}:`, error);
                throw error;
            }
        }

        // ============================================================
        // INICIALIZAÇÃO DO MAPA
        // ============================================================
        const map = L.map('map').setView([-15.8, -47.9], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        let markerLayer = L.layerGroup().addTo(map);
        let markers = {};

        // ============================================================
        // FUNÇÃO PARA ADICIONAR MARCADORES
        // ============================================================
        function adicionarMarcadores(estacoes) {
            markerLayer.clearLayers();
            markers = {};

            if (!estacoes || estacoes.length === 0) {
                mostrarResultado('Nenhuma estação encontrada.');
                return;
            }

            estacoes.forEach((estacao) => {
                const lat = estacao.latitude;
                const lon = estacao.longitude;
                if (!lat || !lon) return;

                const marker = L.marker([lat, lon], {
                    title: estacao.id_estacao
                });

                const popupContent = `
                    <strong>ID:</strong> ${estacao.id_estacao}<br>
                    <strong>Operadora:</strong> ${estacao.operadora || 'N/A'}<br>
                    <strong>UF:</strong> ${estacao.uf || 'N/A'}<br>
                    <strong>Município:</strong> ${estacao.municipio || 'N/A'}<br>
                    <strong>Tecnologias:</strong> ${estacao.tecnologias || 'N/A'}<br>
                    <strong>Frequências:</strong> ${estacao.frequencias || 'N/A'}<br>
                    <strong>Distância:</strong> ${estacao.distancia ? estacao.distancia.toFixed(2) + ' km' : 'N/A'}
                `;
                marker.bindPopup(popupContent);

                markerLayer.addLayer(marker);
                markers[estacao.id_estacao] = marker;
            });

            // Ajusta o zoom para mostrar todos os marcadores
            if (estacoes.length > 0) {
                const group = L.featureGroup(Object.values(markers));
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            }

            mostrarResultado(`${estacoes.length} estações encontradas.`);
        }

        // ============================================================
        // FUNÇÕES DE INTERFACE
        // ============================================================
        function mostrarResultado(mensagem) {
            const el = document.getElementById('resultado');
            const conteudo = document.getElementById('resultadoConteudo');
            conteudo.textContent = typeof mensagem === 'object' ? JSON.stringify(mensagem, null, 2) : mensagem;
            el.classList.add('show');
        }

        document.getElementById('closeResultado').addEventListener('click', () => {
            document.getElementById('resultado').classList.remove('show');
        });

        // ============================================================
        // EVENTO: CADASTRAR NÚMERO
        // ============================================================
        document.getElementById('btnCadastrar').addEventListener('click', async () => {
            const numero = document.getElementById('numero').value.trim();
            const operadora = document.getElementById('operadora').value;
            const nome = document.getElementById('nome').value.trim();

            if (!numero) {
                mostrarResultado('❌ Número de celular é obrigatório.');
                return;
            }

            try {
                const data = await apiRequest('/api/numeros', {
                    method: 'POST',
                    body: JSON.stringify({ numero, operadora, uf: '', municipio: nome || '' })
                });
                mostrarResultado(`✅ Número ${numero} cadastrado com sucesso!`);
                document.getElementById('status').textContent = '🟢 Conectado';
            } catch (error) {
                mostrarResultado(`❌ Erro ao cadastrar: ${error.message}`);
                document.getElementById('status').textContent = '🔴 Erro de conexão';
            }
        });

        // ============================================================
        // EVENTO: LOCALIZAR POR NÚMERO
        // ============================================================
        document.getElementById('btnLocalizar').addEventListener('click', async () => {
            const numero = document.getElementById('numero').value.trim();

            if (!numero) {
                mostrarResultado('❌ Número de celular é obrigatório.');
                return;
            }

            // Por simplicidade, vamos buscar estações próximas a uma localização fixa (Brasília)
            // Em um cenário real, você teria uma lógica para associar o número a uma localização.
            const lat = -15.8;
            const lon = -47.9;
            const raio = 50;

            try {
                const data = await apiRequest(`/api/estacoes/proximas?lat=${lat}&lon=${lon}&raio=${raio}`);
                adicionarMarcadores(data);
                mostrarResultado(`✅ ${data.length} estações encontradas para o número ${numero}.`);
                document.getElementById('status').textContent = '🟢 Conectado';
            } catch (error) {
                mostrarResultado(`❌ Erro ao localizar: ${error.message}`);
                document.getElementById('status').textContent = '🔴 Erro de conexão';
            }
        });

        // ============================================================
        // VERIFICAÇÃO INICIAL DE CONEXÃO
        // ============================================================
        async function verificarConexao() {
            try {
                const data = await apiRequest('/api/estatisticas');
                document.getElementById('status').textContent = '🟢 Conectado';
                mostrarResultado(`✅ Sistema conectado. ${data.total_estacoes || 0} estações disponíveis.`);
            } catch (error) {
                document.getElementById('status').textContent = '🔴 Erro de conexão';
                mostrarResultado(`❌ Erro de conexão com o servidor: ${error.message}`);
            }
        }

        // Inicializa
        verificarConexao();
    </script>
</body>
</html>
