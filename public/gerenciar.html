<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION - Gerenciar Bases e Recursos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b1a2e; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1100px; background: #132b44; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        h1, h2 { color: #00d4ff; margin-bottom: 20px; }
        h2 { font-size: 1.2rem; margin-top: 30px; border-bottom: 1px solid #2a4a7a; padding-bottom: 10px; }
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: flex-end; background: #0b1a2e; padding: 15px; border-radius: 10px; }
        .form-group label { display: flex; flex-direction: column; flex: 1; min-width: 120px; gap: 4px; color: #88bbdd; font-size: 12px; }
        .form-group input, .form-group select { padding: 8px 12px; border: none; border-radius: 6px; background: #1e3a5f; color: #fff; font-size: 14px; outline: 1px solid #2a4a7a; }
        .form-group input:focus, .form-group select:focus { outline: 2px solid #00d4ff; }
        .form-group button { padding: 8px 24px; background: #00d4ff; border: none; border-radius: 6px; font-weight: bold; color: #0b1a2e; cursor: pointer; transition: 0.3s; flex: 0 0 auto; height: 38px; }
        .form-group button:hover { background: #00b8e6; transform: scale(1.02); }
        .form-group button.danger { background: #f44336; color: #fff; }
        .form-group button.danger:hover { background: #d32f2f; }
        .mensagem { padding: 10px; border-radius: 6px; margin: 10px 0; display: none; }
        .mensagem.sucesso { background: #1a4a2a; color: #8bffb0; display: block; border-left: 4px solid #4caf50; }
        .mensagem.erro { background: #4a1a1a; color: #ff8b8b; display: block; border-left: 4px solid #f44336; }
        .tabela { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .tabela th { background: #1e3a5f; text-align: left; padding: 12px 10px; color: #88bbdd; }
        .tabela td { padding: 10px; border-bottom: 1px solid #1e3a5f; vertical-align: middle; }
        .tabela tr:hover { background: #1a3350; }
        .tabela .acoes button { background: #2a4a7a; border: none; padding: 4px 12px; border-radius: 4px; color: #fff; cursor: pointer; font-size: 12px; transition: 0.2s; margin-right: 4px; }
        .tabela .acoes button:hover { background: #3a6a9a; }
        .tabela .acoes button.danger { background: #f44336; }
        .tabela .acoes button.danger:hover { background: #d32f2f; }
        .vazio { color: #557799; text-align: center; padding: 20px; }
        .loading { color: #88bbdd; text-align: center; padding: 20px; }
        .voltar { display: inline-block; margin-top: 20px; color: #88bbdd; text-decoration: none; }
        .voltar:hover { color: #00d4ff; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #2a4a7a; }
        .badge-cadastrado { background: #1a4a2a; color: #8bffb0; }
        .badge-desconhecido { background: #4a3a1a; color: #ffb74d; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 ORION - Gerenciar Bases e Recursos</h1>
    <p style="color: #88bbdd; margin-bottom: 20px;">Gerencie suas bases (cidades/setores) e recursos (números de celular).</p>

    <div id="mensagemGlobal" class="mensagem"></div>

    <!-- ========== FORMULÁRIO DE BASE ========== -->
    <h2>🏢 Cadastrar Nova Base</h2>
    <div class="form-group" id="formBase">
        <label>Nome da Base <input type="text" id="nomeBase" placeholder="Ex: Salvador Matriz" value="Salvador Piatã"></label>
        <label>UF <input type="text" id="ufBase" placeholder="BA" value="BA"></label>
        <label>Município <input type="text" id="municipioBase" placeholder="Salvador" value="Salvador"></label>
        <label>Latitude <input type="number" step="any" id="latBase" placeholder="-12.9342" value="-12.9342"></label>
        <label>Longitude <input type="number" step="any" id="lonBase" placeholder="-38.3751" value="-38.3751"></label>
        <button onclick="cadastrarBase()">📥 Cadastrar Base</button>
    </div>

    <!-- ========== LISTA DE BASES ========== -->
    <h2>🏢 Bases Cadastradas</h2>
    <div id="listaBases" style="overflow-x: auto;">
        <div class="loading">⏳ Carregando bases...</div>
    </div>

    <!-- ========== FORMULÁRIO DE RECURSO ========== -->
    <h2>📱 Cadastrar Recurso (Número)</h2>
    <div class="form-group" id="formRecurso">
        <label>Número <input type="text" id="numeroRecurso" placeholder="71985549724" value="71985549724"></label>
        <label>Operadora <input type="text" id="operadoraRecurso" placeholder="Vivo" value="Vivo"></label>
        <label>Nome (opcional) <input type="text" id="nomeRecurso" placeholder="Celular teste"></label>
        <label>Base (ID) <input type="number" id="baseRecurso" placeholder="ID da base"></label>
        <label>Status 
            <select id="statusRecurso">
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
                <option value="desconhecido" selected>Desconhecido</option>
            </select>
        </label>
        <button onclick="cadastrarRecurso()">📥 Cadastrar Recurso</button>
    </div>

    <!-- ========== LISTA DE RECURSOS ========== -->
    <h2>📱 Recursos Cadastrados</h2>
    <div id="listaRecursos" style="overflow-x: auto;">
        <div class="loading">⏳ Carregando recursos...</div>
    </div>

    <a href="mapa-localizar.html" class="voltar">🗺️ Ir para o Mapa Inteligente</a>
</div>

<script>
    // ============================================================
    // CONFIGURAÇÕES
    // ============================================================
    const API_URL = window.location.origin;

    // ============================================================
    // FUNÇÃO PARA MOSTRAR MENSAGEM
    // ============================================================
    function mostrarMensagem(texto, tipo = 'sucesso', tempo = 5000) {
        const el = document.getElementById('mensagemGlobal');
        el.textContent = texto;
        el.className = `mensagem ${tipo}`;
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => {
            el.className = 'mensagem';
            el.textContent = '';
        }, tempo);
    }

    // ============================================================
    // 1. GERENCIAR BASES
    // ============================================================

    async function carregarBases() {
        const container = document.getElementById('listaBases');
        try {
            const response = await fetch(`${API_URL}/api/bases`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="vazio">Nenhuma base cadastrada.</div>`;
                return;
            }

            let html = `<table class="tabela"><thead><tr>
                <th>ID</th><th>Nome</th><th>UF</th><th>Município</th>
                <th>Latitude</th><th>Longitude</th><th>Ações</th>
            </tr></thead><tbody>`;
            data.forEach(item => {
                html += `<tr>
                    <td>${item.id}</td>
                    <td><strong>${item.nome}</strong></td>
                    <td>${item.uf || '-'}</td>
                    <td>${item.municipio || '-'}</td>
                    <td>${item.latitude}</td>
                    <td>${item.longitude}</td>
                    <td class="acoes">
                        <button onclick="excluirBase(${item.id})" class="danger">🗑️ Excluir</button>
                        <button onclick="preencherBase(${item.id})">✏️ Editar</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `<div class="vazio" style="color:#f44336;">❌ Erro ao carregar bases: ${error.message}</div>`;
        }
    }

    async function cadastrarBase() {
        const nome = document.getElementById('nomeBase').value.trim();
        const uf = document.getElementById('ufBase').value.trim();
        const municipio = document.getElementById('municipioBase').value.trim();
        const latitude = parseFloat(document.getElementById('latBase').value);
        const longitude = parseFloat(document.getElementById('lonBase').value);

        if (!nome || isNaN(latitude) || isNaN(longitude)) {
            mostrarMensagem('❌ Preencha todos os campos corretamente.', 'erro');
            return;
        }

        const body = { nome, uf, municipio, latitude, longitude };

        try {
            const response = await fetch(`${API_URL}/api/bases`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();

            if (response.ok && data.success) {
                mostrarMensagem(`✅ Base "${nome}" cadastrada com sucesso! (ID: ${data.id})`, 'sucesso');
                // Limpa o campo nome, mantendo os demais
                document.getElementById('nomeBase').value = '';
                carregarBases();
            } else {
                mostrarMensagem(`❌ Erro ao cadastrar base: ${data.error || 'Falha no servidor'}`, 'erro');
            }
        } catch (error) {
            mostrarMensagem(`❌ Erro de rede: ${error.message}`, 'erro');
        }
    }

    // Função para preencher o formulário de base com os dados para edição
    function preencherBase(id) {
        mostrarMensagem(`✏️ Edição da base ${id} em breve. Por enquanto, exclua e recrie.`, 'sucesso', 3000);
        // Aqui você pode implementar a lógica de edição
    }

    async function excluirBase(id) {
        if (!confirm(`Deseja realmente excluir a base com ID ${id}?`)) return;
        try {
            const response = await fetch(`${API_URL}/api/bases/${id}`, { method: 'DELETE' });
            if (response.ok) {
                mostrarMensagem(`🗑️ Base ${id} excluída com sucesso.`, 'sucesso');
                carregarBases();
            } else {
                const data = await response.json();
                mostrarMensagem(`❌ Erro ao excluir: ${data.error || response.status}`, 'erro');
            }
        } catch (error) {
            mostrarMensagem(`❌ Erro de rede: ${error.message}`, 'erro');
        }
    }

    // ============================================================
    // 2. GERENCIAR RECURSOS
    // ============================================================

    async function carregarRecursos() {
        const container = document.getElementById('listaRecursos');
        try {
            const response = await fetch(`${API_URL}/api/recursos`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="vazio">Nenhum recurso cadastrado.</div>`;
                return;
            }

            let html = `<table class="tabela"><thead><tr>
                <th>ID</th><th>Número</th><th>Operadora</th><th>Base ID</th><th>Status</th><th>Ações</th>
            </tr></thead><tbody>`;
            data.forEach(item => {
                html += `<tr>
                    <td>${item.id}</td>
                    <td><strong>${item.numero}</strong></td>
                    <td>${item.operadora || '-'}</td>
                    <td>${item.base_id || '-'}</td>
                    <td><span class="badge badge-${item.status}">${item.status || 'desconhecido'}</span></td>
                    <td class="acoes">
                        <button onclick="excluirRecurso(${item.id})" class="danger">🗑️ Excluir</button>
                        <button onclick="moverRecurso(${item.id})">📌 Mover</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `<div class="vazio" style="color:#f44336;">❌ Erro ao carregar recursos: ${error.message}</div>`;
        }
    }

    async function cadastrarRecurso() {
        const numero = document.getElementById('numeroRecurso').value.trim();
        const operadora = document.getElementById('operadoraRecurso').value.trim();
        const nome = document.getElementById('nomeRecurso').value.trim();
        const base_id = parseInt(document.getElementById('baseRecurso').value);
        const status = document.getElementById('statusRecurso').value;

        if (!numero) {
            mostrarMensagem('❌ Número é obrigatório.', 'erro');
            return;
        }

        // Se base_id não for um número válido, enviar como null
        const baseIdFinal = isNaN(base_id) ? null : base_id;

        const body = { numero, operadora, nome, base_id: baseIdFinal, status };

        try {
            const response = await fetch(`${API_URL}/api/recursos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();

            if (response.ok && data.success) {
                mostrarMensagem(`✅ Recurso "${numero}" cadastrado com sucesso! (ID: ${data.id})`, 'sucesso');
                document.getElementById('numeroRecurso').value = '';
                document.getElementById('nomeRecurso').value = '';
                document.getElementById('baseRecurso').value = '';
                carregarRecursos();
            } else {
                mostrarMensagem(`❌ Erro ao cadastrar recurso: ${data.error || 'Falha no servidor'}`, 'erro');
            }
        } catch (error) {
            mostrarMensagem(`❌ Erro de rede: ${error.message}`, 'erro');
        }
    }

    function moverRecurso(id) {
        const novaBase = prompt('Digite o ID da nova base (número inteiro):');
        if (novaBase === null) return; // Cancelou
        const baseId = parseInt(novaBase);
        if (isNaN(baseId)) {
            mostrarMensagem('❌ ID da base inválido. Deve ser um número.', 'erro');
            return;
        }

        fetch(`${API_URL}/api/recursos/${id}/mover`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base_id: baseId })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                mostrarMensagem(`✅ Recurso movido para base ${baseId} com sucesso.`, 'sucesso');
                carregarRecursos();
            } else {
                mostrarMensagem(`❌ Erro ao mover: ${data.error || 'Falha no servidor'}`, 'erro');
            }
        })
        .catch(error => mostrarMensagem(`❌ Erro de rede: ${error.message}`, 'erro'));
    }

    async function excluirRecurso(id) {
        if (!confirm(`Deseja realmente excluir o recurso com ID ${id}?`)) return;
        try {
            const response = await fetch(`${API_URL}/api/recursos/${id}`, { method: 'DELETE' });
            if (response.ok) {
                mostrarMensagem(`🗑️ Recurso ${id} excluído com sucesso.`, 'sucesso');
                carregarRecursos();
            } else {
                const data = await response.json();
                mostrarMensagem(`❌ Erro ao excluir: ${data.error || response.status}`, 'erro');
            }
        } catch (error) {
            mostrarMensagem(`❌ Erro de rede: ${error.message}`, 'erro');
        }
    }

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        carregarBases();
        carregarRecursos();
    });
</script>
</body>
</html>
